<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data: blob:; media-src blob: vh:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src vh: https://api.github.com" />
    <title>VidHub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="navBack" class="navbtn" title="上一步（Alt+← / Backspace / 滑鼠側鍵）" disabled>‹</button>
      <div class="brand">Vid<span>Hub</span></div>
      <nav class="tabs" id="tabs"></nav>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="搜尋影片、劇集" autocomplete="off" />
        <button type="submit">搜尋</button>
      </form>
    </header>
    <main id="view"></main>

    <div id="player" class="player hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="../node_modules/hls.js/dist/hls.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
